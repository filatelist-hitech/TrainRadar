version: 1
documents:
  - path: docs/PROJECT_MAP.md
    audience: developers
    owner: engineering
    type: generated
    source_paths: [AGENTS.md, Makefile, .env.example, backend/**, data/**, docs/**, infra/**, mobile/**, openapi/**, scripts/**, test/**, docker-compose.yml]
    generation_command: ruby scripts/docs_gate.rb sync
    check_command: ruby scripts/docs_gate.rb check
    update_conditions: tracked repository structure, interfaces, configuration keys, or verification commands change
    auto_stage: true
  - path: README.md
    audience: users-and-developers
    owner: product-and-engineering
    type: generated-sections
    generated_sections: [root-commands-and-configuration]
    source_paths: [Makefile, .env.example, docs/DOCS_MANIFEST.yaml]
    generation_command: ruby scripts/docs_gate.rb sync
    check_command: ruby scripts/docs_gate.rb check
    update_conditions: canonical commands or documented configuration keys change
    auto_stage: false
  - path: mobile/README.md
    audience: mobile-developers
    owner: mobile-engineering
    type: generated-sections
    generated_sections: [mobile-capabilities]
    source_paths: [mobile/pubspec.yaml, mobile/lib/main.dart, mobile/android/**, mobile/ios/**]
    generation_command: ruby scripts/docs_gate.rb sync
    check_command: ruby scripts/docs_gate.rb check
    update_conditions: mobile package, supported platform, entrypoint, or module checks change
    auto_stage: false
  - path: docs/API_CONTRACT.md
    audience: API-consumers
    owner: backend-engineering
    type: generated-sections
    generated_sections: [api-reference]
    source_paths: [openapi/openapi.yaml]
    generation_command: ruby scripts/docs_gate.rb sync
    check_command: ruby scripts/docs_gate.rb check
    update_conditions: OpenAPI operation list changes
    auto_stage: false
  - path: AGENTS.md
    audience: codex-agents
    owner: engineering
    type: human
    source_paths: [AGENTS.md, Makefile, docs/CONTRIBUTING.md]
    generation_command: manual
    check_command: ruby scripts/docs_gate.rb check-impact --staged
    update_conditions: development workflow or project invariants change
    auto_stage: false
  - path: docs/CONTRIBUTING.md
    audience: developers
    owner: engineering
    type: human
    source_paths: [Makefile, .githooks/**, .github/workflows/**, scripts/docs_gate.rb, docs/DOCS_MANIFEST.yaml, docs/CHANGE_IMPACT.yaml]
    generation_command: manual
    check_command: ruby scripts/docs_gate.rb check-impact --staged
    update_conditions: commit gate, generated documentation workflow, CI gate, or recovery procedure changes
    auto_stage: false
  - path: docs/ARCHITECTURE.md
    audience: developers
    owner: architecture
    type: human
    source_paths: [backend/**, infra/**, docker-compose.yml]
    generation_command: manual
    check_command: ruby scripts/docs_gate.rb check-impact --staged
    update_conditions: service boundaries, storage, or runtime topology change
    auto_stage: false
  - path: docs/CORRIDOR_REGISTRY.md
    audience: data-and-product
    owner: data
    type: human
    source_paths: [data/reference/paveletsky_uzunovo_stations.yaml]
    generation_command: manual
    check_command: ruby scripts/docs_gate.rb check-impact --staged
    update_conditions: corridor registry semantics change
    auto_stage: false
  - path: docs/DATA_DICTIONARY.md
